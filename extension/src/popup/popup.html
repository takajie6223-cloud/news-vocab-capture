<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Reuters 取词</title>
  <style>
    :root {
      --bg: #fafaf8;
      --card: #ffffff;
      --ink: #1a1a18;
      --sub: #5c5c56;
      --muted: #8a8a82;
      --line: #e6e6e0;
      --soft: #f3f3ee;
      --accent: #fa6400;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
    }
    .box { padding: 14px; }
    h1 {
      margin: 0 0 2px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo { color: var(--accent); }
    .sub { margin: 0 0 12px; color: var(--muted); font-size: 11px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .stat b { display: block; font-size: 16px; }
    .stat span { color: var(--muted); font-size: 11px; }
    .row { display: flex; flex-direction: column; gap: 6px; }
    button {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      color: var(--ink);
      text-align: left;
    }
    button:hover { background: var(--soft); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      text-align: center;
      font-weight: 600;
    }
    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1><span class="logo">★</span> Reuters 取词</h1>
    <p class="sub">双击查词 · Alt+S 收藏 · Alt+V 侧栏</p>
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>全部</span></div>
      <div class="stat"><b id="due">0</b><span>待复习</span></div>
      <div class="stat"><b id="today">0</b><span>今日</span></div>
    </div>
    <div class="row">
      <button class="primary" id="btn-panel">打开生词本侧栏</button>
      <button id="btn-review">开始复习</button>
      <button id="btn-options">设置</button>
      <button id="btn-open">打开 Reuters</button>
    </div>
    <p class="hint">在文章页双击英文单词即可弹出释义，点 ★ 收藏进生词本。</p>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
